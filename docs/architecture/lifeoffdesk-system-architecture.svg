<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-labelledby="title desc">
  <title id="title">Life Off Desk system architecture</title>
  <desc id="desc">Offline-first iPhone architecture showing the GPS, map, local AI, persistence, failure containment, cost, and benchmark status.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#283A31" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#46785B"/></marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#69776D"/></marker>
    <style>
      .h1{font:700 54px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#283A31}.sub{font:400 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#69776D}.kicker{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:2px;fill:#46785B}.section{font:700 28px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#283A31}.boxh{font:700 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#283A31}.body{font:400 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#46564D}.small{font:400 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#59695E}.tiny{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#69776D;letter-spacing:.5px}.white{fill:#fff}.danger{fill:#A13D36}.amber{fill:#8A5D18}.box{fill:#fff;stroke:#D9DED4;stroke-width:2;rx:22;filter:url(#shadow)}.soft{fill:#EDF2EA;stroke:#C8D4C9;stroke-width:2;rx:22}.risk{fill:#FFF7EA;stroke:#E7C88E;stroke-width:2;rx:22}.bad{fill:#FFF1EF;stroke:#D9A19C;stroke-width:2;rx:22}.flow{fill:none;stroke:#46785B;stroke-width:4;marker-end:url(#arrow)}.flow2{fill:none;stroke:#69776D;stroke-width:3;stroke-dasharray:10 10;marker-end:url(#arrowMuted)}
    </style>
  </defs>
  <rect width="2400" height="1600" fill="#F8F6EF"/>
  <rect x="0" y="0" width="2400" height="14" fill="#46785B"/>
  <text id="architecture-title" x="90" y="92" class="kicker">SYSTEM ARCHITECTURE · CURRENT CHECKOUT · OCTOBER 2026</text>
  <text x="90" y="158" class="h1">Life Off Desk — offline-first iPhone architecture</text>
  <text x="90" y="202" class="sub">Map-first walk recording, durable local history, streamed street context, and constrained on-device AI.</text>
  <rect x="1920" y="76" width="390" height="112" rx="20" fill="#283A31"/>
  <text x="1950" y="118" class="tiny white">TRUST BOUNDARY</text><text x="1950" y="151" class="body white">No backend · no account</text><text x="1950" y="177" class="body white">no cloud inference</text>

  <text x="90" y="278" class="section">1 · Product and sensing</text>
  <rect class="box" x="90" y="310" width="430" height="195"/>
  <text x="120" y="350" class="boxh">SwiftUI product surfaces</text>
  <text x="120" y="384" class="body">Map · Planner · Adventures</text><text x="120" y="414" class="body">Recap · Help · Preferences</text>
  <rect x="120" y="447" width="330" height="36" rx="18" fill="#EDF2EA"/><text x="143" y="471" class="small">AppModel @MainActor owns app state</text>
  <rect class="box" x="90" y="540" width="430" height="180"/>
  <text x="120" y="580" class="boxh">On-device inputs</text>
  <text x="120" y="615" class="body">CoreLocation GPS · typed Taglish</text><text x="120" y="646" class="body">Apple Speech · Apple Vision labels</text>
  <text x="120" y="684" class="small">Speech and Vision never require a server.</text>

  <text x="580" y="278" class="section">2 · Deterministic walking pipeline</text>
  <rect class="soft" x="580" y="310" width="560" height="410"/>
  <text x="615" y="350" class="boxh">The walk remains correct without AI</text>
  <rect class="box" x="615" y="380" width="220" height="78"/><text x="644" y="413" class="boxh">TrackFilter</text><text x="644" y="440" class="small">accuracy · time · speed</text>
  <rect class="box" x="875" y="380" width="225" height="78"/><text x="902" y="413" class="boxh">WalkSession</text><text x="902" y="440" class="small">pause · segments · stats</text>
  <path class="flow" d="M835 419 L875 419"/>
  <rect class="box" x="615" y="492" width="220" height="82"/><text x="644" y="526" class="boxh">Street matching</text><text x="644" y="553" class="small">snap context to roads</text>
  <rect class="box" x="875" y="492" width="225" height="82"/><text x="902" y="526" class="boxh">Reveal + route</text><text x="902" y="553" class="small">fog · trails · suggestions</text>
  <path class="flow" d="M835 533 L875 533"/>
  <rect class="box" x="615" y="610" width="485" height="76"/><text x="644" y="641" class="boxh">Canvas map renderer</text><text x="644" y="668" class="small">visible tiles · cached islands · simplified history paths</text>
  <path class="flow" d="M987 574 L987 610"/>
  <path class="flow" d="M520 623 L615 623"/>

  <text x="1200" y="278" class="section">3 · Constrained local AI pipeline</text>
  <rect class="soft" x="1200" y="310" width="630" height="410"/>
  <text x="1235" y="350" class="boxh">AI proposes bounded choices; code stays authoritative</text>
  <rect class="box" x="1235" y="380" width="260" height="94"/><text x="1265" y="414" class="boxh">InferenceCoordinator</text><text x="1265" y="443" class="small">single-flight load · serial run</text><text x="1265" y="465" class="small">cancel + stale-result guard</text>
  <rect class="box" x="1530" y="380" width="265" height="94"/><text x="1560" y="414" class="boxh">Qwen3 1.7B Q4</text><text x="1560" y="443" class="small">llama.cpp · 2,048 context</text><text x="1560" y="465" class="small">greedy · GBNF grammar</text>
  <path class="flow" d="M1495 427 L1530 427"/>
  <rect class="box" x="1235" y="510" width="560" height="82"/><text x="1265" y="543" class="boxh">Validate → repair once → deterministic execution</text><text x="1265" y="571" class="small">schema · enums · bounds · candidate IDs · computed templates</text>
  <path class="flow" d="M1662 474 L1662 510"/>
  <text x="1238" y="628" class="small">Planner intent · history query · recap facts · world coach</text>
  <text x="1238" y="658" class="small">place selection · safety topic selection</text>
  <rect x="1235" y="680" width="560" height="24" rx="12" fill="#46785B" opacity=".16"/>
  <text x="1250" y="698" class="tiny">AI NEVER OWNS GPS, MATH, ELIGIBILITY, ROUTES, OR MEDICAL PROSE</text>
  <path class="flow2" d="M1200 530 L1140 530"/>

  <text x="1890" y="278" class="section">4 · Failure containment</text>
  <rect class="box" x="1890" y="310" width="420" height="410"/>
  <text x="1920" y="352" class="boxh">Graceful degradation</text>
  <text x="1920" y="392" class="body">AI missing / memory pressure</text><text x="1920" y="419" class="small">→ manual filters + computed copy</text>
  <text x="1920" y="463" class="body">Bad GPS / long gap</text><text x="1920" y="490" class="small">→ reject fix + split segment</text>
  <text x="1920" y="534" class="body">Street graph unavailable</text><text x="1920" y="561" class="small">→ labeled straight-line fallback</text>
  <text x="1920" y="605" class="body">Interrupted write / crash</text><text x="1920" y="632" class="small">→ atomic file + .bak + paused recovery</text>
  <text x="1920" y="676" class="body">Safety uncertainty</text><text x="1920" y="703" class="small">→ keywords can raise urgency; bundled card</text>

  <text x="90" y="790" class="section">5 · Local data and runtime</text>
  <rect class="box" x="90" y="825" width="530" height="210"/>
  <text x="120" y="867" class="boxh">Personal store · Application Support</text>
  <text x="120" y="903" class="body">Versioned JSON walks · active checkpoint</text><text x="120" y="934" class="body">preferences · profile · recap · photos</text>
  <text x="120" y="979" class="small">Atomic temp→backup write; corrupt files quarantined.</text><text x="120" y="1007" class="small danger">Device loss remains unrecoverable: no export or cloud backup.</text>
  <rect class="box" x="660" y="825" width="530" height="210"/>
  <text x="690" y="867" class="boxh">Region library · current checkout</text>
  <text x="690" y="903" class="body">89,294 roads · 26,934 places · 26.58 MiB</text><text x="690" y="934" class="body">Primary/context packs + viewport chunk streaming</text>
  <text x="690" y="979" class="small">Decode/build off-main; generation guard rejects stale graphs.</text><text x="690" y="1007" class="small">Idle, distant city chunks can be evicted.</text>
  <rect class="box" x="1230" y="825" width="530" height="210"/>
  <text x="1260" y="867" class="boxh">Pinned AI material</text>
  <text x="1260" y="903" class="body">Qwen3-1.7B-Q4_K_M · 1,282,439,264 bytes</text><text x="1260" y="934" class="body">llama.cpp b11429 · SHA-256 locked</text>
  <text x="1260" y="979" class="small">Preflight: model size + 700 MiB headroom ≈ 1.88 GiB.</text><text x="1260" y="1007" class="small amber">This is a gate, not a measured peak-memory benchmark.</text>
  <rect class="box" x="1800" y="825" width="510" height="210"/>
  <text x="1830" y="867" class="boxh">Apple platform boundary</text>
  <text x="1830" y="903" class="body">CoreLocation · SwiftUI · Canvas · UIKit</text><text x="1830" y="934" class="body">Speech · Vision · CryptoKit</text>
  <text x="1830" y="979" class="small">Target: physical iPhone 12 Pro Max.</text><text x="1830" y="1007" class="small">Simulator labels AI/location limitations visibly.</text>
  <path class="flow" d="M355 825 L355 720"/><path class="flow" d="M925 825 L925 720"/><path class="flow" d="M1495 825 L1495 720"/>

  <text x="90" y="1105" class="section">6 · Cost, breakpoints, and evidence</text>
  <rect class="bad" x="90" y="1140" width="700" height="325"/>
  <text x="125" y="1183" class="boxh danger">Highest resource cost · on-device model</text>
  <text x="125" y="1223" class="body">1.28 GB artifact, load latency, RAM pressure, heat, battery.</text>
  <text x="125" y="1260" class="small">First likely device gate: load/generation under memory or thermal</text><text x="125" y="1286" class="small">pressure. Exact iPhone threshold is not measured yet.</text>
  <line x1="125" y1="1315" x2="755" y2="1315" stroke="#D9A19C"/>
  <text x="125" y="1351" class="boxh danger">Highest scale cost · history + geometry</text>
  <text x="125" y="1387" class="small">One JSON file per walk, ~1 fix/sec, aggregate recomputation.</text><text x="125" y="1413" class="small">Observed prior lag: 84 demo walks / ~400k map vertices.</text><text x="125" y="1439" class="small">Mitigated with simplification/caching; phone smoothness is open.</text>
  <rect class="risk" x="830" y="1140" width="710" height="325"/>
  <text x="865" y="1183" class="boxh amber">Measured on development CPU</text>
  <text x="865" y="1223" class="body">Planner v5: 60/60 schema-valid · 46/60 intent pass</text><text x="865" y="1253" class="body">Adaptive: 14/14 valid · 10/14 intent · ~25 s/request</text><text x="865" y="1283" class="body">History: 14/14 valid · 10/14 pass · ~18–21 s/request</text><text x="865" y="1313" class="body">Recap: 12/12 valid fact-ID selections</text>
  <line x1="865" y1="1340" x2="1505" y2="1340" stroke="#E7C88E"/>
  <text x="865" y="1375" class="small">Core tests today: 158 passed in 22.006 s.</text><text x="865" y="1404" class="small">Founder phone observation: ~10 s planner response (anecdotal).</text><text x="865" y="1433" class="small amber">These results are not formal iPhone performance benchmarks.</text>
  <rect class="soft" x="1580" y="1140" width="730" height="325"/>
  <text x="1615" y="1183" class="boxh">Required acceptance run · iPhone 12 Pro Max</text>
  <text x="1615" y="1223" class="body">Cold model load · p50/p95 task latency · tokens/sec</text><text x="1615" y="1253" class="body">peak memory · thermal state · battery · cancellation</text><text x="1615" y="1283" class="body">offline mode · background GPS · route/fog frame pacing</text>
  <line x1="1615" y1="1315" x2="2275" y2="1315" stroke="#C8D4C9"/>
  <text x="1615" y="1351" class="boxh">Next architecture controls</text>
  <text x="1615" y="1386" class="small">1. Signposts + reproducible device benchmark harness</text><text x="1615" y="1412" class="small">2. Walk summaries/index + save-time track thinning</text><text x="1615" y="1438" class="small">3. User export/backup + reviewed place/route evidence</text>
  <rect x="90" y="1510" width="2220" height="2" fill="#D9DED4"/><text x="90" y="1555" class="tiny">SOLID = DATA FLOW · DASHED = CONTROL/FALLBACK · MEASUREMENTS LABEL THEIR ENVIRONMENT · UNKNOWN LIMITS REMAIN EXPLICIT</text>
</svg>
