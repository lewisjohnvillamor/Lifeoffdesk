# Compile check only: builds the app for a generic iOS device without signing and runs the core
# tests on macOS. It does not install on a phone or prove on-device inference.
name: iOS build check
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: xcodebuild -version && swift --version
      - name: Core tests
        run: swift test --package-path Packages/LifeOffDeskCore
      - name: Python preparation tests
        run: python3 -m unittest discover -s tests
      - name: Download pinned runtime and model (checksum-verified)
        run: python3 scripts/download_materials.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Unpack runtime and generate project
        run: scripts/setup_ios.sh
      - name: Build for generic iOS device (unsigned)
        run: |
          xcodebuild -project LifeOffDesk/LifeOffDesk.xcodeproj -scheme LifeOffDesk \
            -destination 'generic/platform=iOS' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tail -200
          exit ${PIPESTATUS[0]}

  # Visual check of the real SwiftUI map in the iOS Simulator (AI excluded there).
  # Screenshots are uploaded as an artifact; demo views show labelled synthetic data.
  simulator-screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build simulator app
        run: |
          xcodegen generate --spec LifeOffDesk/project-simulator.yml
          xcodebuild -project LifeOffDesk/LifeOffDeskSimulator.xcodeproj -scheme LifeOffDesk \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim -configuration Debug build | tail -40
          exit ${PIPESTATUS[0]}
      - name: Capture screenshots
        run: |
          set -euo pipefail
          TYPE=$(xcrun simctl list devicetypes | grep -o "com.apple.CoreSimulator.SimDeviceType.iPhone-1[0-9]-Pro-Max" | tail -1)
          UDID=$(xcrun simctl create shots "$TYPE")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          APP=$(find build/sim/Build/Products -name "LifeOffDesk.app" -maxdepth 3 | head -1)
          xcrun simctl install "$UDID" "$APP"
          # Grant location up front so the system prompt never covers screenshots.
          xcrun simctl privacy "$UDID" grant location com.lifeoffdesk.simulator || true
          xcrun simctl location "$UDID" set 14.55420,121.02170 || true
          mkdir -p screenshots
          EXTRA=""
          shoot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" com.lifeoffdesk.simulator 2>/dev/null || true
            xcrun simctl launch "$UDID" com.lifeoffdesk.simulator "$@" $EXTRA
            sleep 8
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          EXTRA="--show-intro"
          shoot 00-intro-1 --intro-page 0
          shoot 00-intro-2 --intro-page 1
          shoot 00-intro-3 --intro-page 2
          shoot 00-intro-4 --intro-page 3
          shoot 00-intro-5 --intro-page 4
          EXTRA="--skip-intro"
          shoot 01-blank
          shoot 02-demo-tilted --demo-map
          shoot 03-demo-closeup --demo-map --map-scale 0.6
          shoot 04-demo-flat --demo-map --flat --map-scale 0.2
          shoot 05-blank-closeup --map-scale 0.6
          shoot 06-planner-results --open-planner --planner-filter park
          shoot 07-recap-card --demo-map --open-recap
          shoot 08-memory-card --demo-map --open-card
          shoot 10-walks-tab --demo-map --tab walks
          shoot 11-me-tab --demo-map --tab me
          # Simulated GPS walk through the real tracking pipeline (simulator location, labelled in-app).
          xcrun simctl privacy "$UDID" grant location-always com.lifeoffdesk.simulator || xcrun simctl privacy "$UDID" grant location com.lifeoffdesk.simulator || true
          # Route follows real Makati street geometry from the bundled road data (~550 m).
          ROUTE="14.557897,121.024944 14.557818,121.024669 14.557316,121.023045 14.557235,121.022777 14.557102,121.022317 14.556949,121.021808 14.556799,121.021289 14.556664,121.021501 14.556532,121.021707 14.556405,121.021906 14.556089,121.022385"
          xcrun simctl location "$UDID" set 14.557897,121.024944 || true
          xcrun simctl terminate "$UDID" com.lifeoffdesk.simulator 2>/dev/null || true
          xcrun simctl launch "$UDID" com.lifeoffdesk.simulator --skip-intro --start-walk --map-scale 0.6 --flat
          sleep 5
          xcrun simctl location "$UDID" start --speed=3.4 --interval=1 $ROUTE || true
          sleep 175
          xcrun simctl io "$UDID" screenshot screenshots/09-walking.png
          xcrun simctl location "$UDID" clear || true
          ls -la screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots/*.png
