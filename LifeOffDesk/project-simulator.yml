# UI/walking checks only. The pinned AI runtime has no simulator slice.
# xcodegen generate --spec LifeOffDesk/project-simulator.yml
include: project.yml
name: LifeOffDeskSimulator
targets:
  LifeOffDesk:
    sources:REPLACE:
      - path: App
      - path: Features
      - path: Services
      - path: Resources/StarterData
        type: folder
        buildPhase: resources
      # App icon, brand colours, mascot poses (cut from assets/mascot/life-off-desk-cat-stickers-male.png).
      - path: Resources/Assets.xcassets
      - path: ../eval/taglish-cases.json
        buildPhase: resources
      - path: ../eval/taglish-heldout.json
        buildPhase: resources
      # Simulator-only test fixture for photo/collage/sticker screenshots.
      - path: ../assets/mascot/life-off-desk-cat-concept.png
        buildPhase: resources
    dependencies:REPLACE:
      - package: LifeOffDeskCore
    info:
      path: Info-Simulator.plist
      properties:
        CFBundleDisplayName: Life Off Desk Sim
        UILaunchScreen:
          UIColorName: BrandCanvas
          UIImageName: LaunchMascot
          UIImageRespectsSafeAreaInsets: true
        NSLocationWhenInUseUsageDescription: Life Off Desk uses your location only during a walk you start.
        UIBackgroundModes: [location]
        NSCameraUsageDescription: Take photos of moments on your walk. Photos stay on this iPhone.
        NSPhotoLibraryAddUsageDescription: Save your walk card to Photos.
    settings:
      base:
        SUPPORTED_PLATFORMS: iphonesimulator
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeoffdesk.simulator
        CODE_SIGNING_ALLOWED: NO
  SimulatorSmokeTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SimulatorTests
    dependencies:
      - target: LifeOffDesk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeoffdesk.simulator.tests
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: LifeOffDesk
schemes:
  LifeOffDesk:
    build:
      targets:
        LifeOffDesk: all
    test:
      targets:
        - SimulatorSmokeTests
